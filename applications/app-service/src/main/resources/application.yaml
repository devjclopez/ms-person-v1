##Spring Configuration
server:
  port: 8080
spring:
  application:
    name: ms-person-v1
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: /h2
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
adapters:
  r2dbc:
    host: "${DB_HOST}"
    port: 5432
    database: "db_person_v1"
    schema: "public"
    username: "${DB_USER}"
    password: "${DB_PASSWORD}"